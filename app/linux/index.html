<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' freecode: data:; connect-src 'none'; object-src 'none'; frame-src 'self'; base-uri 'none'; form-action 'none'">
<title>FreeCode</title><link rel="stylesheet" href="ui.css"></head><body>
<header class="toolbar"><div class="brand"><img src="icon.png" alt=""><strong>FreeCode</strong></div><div id="breadcrumb">Problems</div><div class="toolbar-actions"><button id="statistics">Statistics</button><button id="random">Random question</button><button id="settings">Settings</button></div></header>
<main id="app"><aside id="sidebar"><nav aria-label="Sections"><button id="problems">Problems</button><button id="learning">Learning</button></nav><div class="sidebar-controls"><div class="search-row"><input id="search" type="search" placeholder="Search problems…" aria-label="Search library"><button id="filters" title="Search filters">Filters</button></div><div id="filter-panel" hidden><label>Difficulty<select id="difficulty"><option>All</option><option>Easy</option><option>Medium</option><option>Hard</option></select></label><label>Status<select id="status"><option>All</option><option>Unstarted</option><option>In progress</option><option>Solved</option><option>Favorites</option><option>Premium</option></select></label><label>Topic<select id="topic"><option>All</option></select></label><button id="clear-filters">Clear filters</button></div><label id="collection-label" for="collection">Collection</label><select id="collection"></select><div id="collection-tools"></div><div id="track-progress"></div></div><div id="library" role="list" aria-label="Questions"></div><footer id="library-summary"></footer></aside>
<div id="workspace"><section id="question" class="pane"><header class="pane-header"><div class="tabs" id="statement-tabs"><button data-tab="Description" class="active">Description</button><button data-tab="Solutions">Solutions</button><button data-tab="Notes">Notes</button></div><button id="focus-question">Focus</button></header><div class="question-heading"><div class="title-row"><h1 id="question-title">Opening your library…</h1><button id="membership">Lists</button><button id="favorite" aria-label="Add to favorites">Favorite</button></div><div class="metadata"><span id="difficulty-badge"></span><span id="progress-status">Unstarted</span></div><div id="tags"></div></div><div id="statement-content"><iframe id="statement" title="Question description" sandbox="allow-same-origin" referrerpolicy="no-referrer"></iframe><div id="solution" hidden></div><div id="notes-panel" hidden><label for="notes">Your notes</label><textarea id="notes" placeholder="Approach, complexity, and things to revisit."></textarea></div></div><footer class="attribution"><span id="attribution"></span><button id="source">Source</button></footer></section>
<div class="splitter" id="pane-divider" role="separator" aria-label="Question and code pane width" aria-orientation="vertical" tabindex="0"></div>
<section id="coding" class="pane"><header class="pane-header"><div class="tabs" id="workspace-tabs"><button data-tab="Code" class="active">Code</button><button data-tab="Architecture" hidden>Architecture</button></div><div class="code-actions"><button class="primary" id="run"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 1.5 14 8 3 14.5Z" fill="currentColor"/></svg><span>Run code</span></button><button id="focus-code">Focus</button></div></header><div id="code-workspace"><div class="editor-toolbar"><select id="language" aria-label="Language"><option value="python">Python</option><option value="javascript">JavaScript</option><option value="cpp">C++</option><option value="java">Java</option><option value="sql">SQL (SQLite)</option></select><span id="filename"></span><button id="starter">Reset starter</button><button id="export">Export code</button></div><div class="execution-mode"><label>Execution <select id="mode"><option value="function">Function tests</option><option value="program">Full program</option><option value="sql">SQL query</option></select></label></div><div id="course-tools" hidden><div class="course-files"><select id="course-file" aria-label="Workspace file"></select><button id="course-new">New file</button><button id="course-rename">Rename</button><button id="course-delete">Delete</button><button id="course-export">Export workspace</button></div><div class="course-actions"><button data-course-action="demo">Demonstration</button><button data-course-action="learner">My tests</button><button data-course-action="typecheck">Types</button><button data-course-action="lint">Lint</button><button data-course-action="benchmark">Benchmarks</button></div></div><div id="editor" aria-label="Code editor"></div><footer class="editor-status"><span id="save-status" role="status">Saved</span><span id="line-count"></span></footer><div class="splitter horizontal" id="console-divider" role="separator" aria-label="Editor and tests height" aria-orientation="horizontal" tabindex="0"></div><section id="console"><header class="pane-header"><div class="tabs" id="console-tabs"><button data-tab="Test cases" class="active">Test cases</button><button data-tab="Results">Results</button></div><button id="minimize-console">Minimize</button></header><div id="test-content"></div><div id="results" hidden></div></section><button id="restore-console" hidden>Show tests & results</button></div><div id="architecture" hidden></div></section></div></main>
<footer id="lesson-navigation" hidden><button id="previous">← Previous lesson</button><span id="step"></span><button id="next">Next lesson →</button></footer>
<div id="notice" role="status" hidden></div><dialog id="dialog"><form method="dialog"><header><h2 id="dialog-title"></h2><button value="cancel" aria-label="Close dialog">Close</button></header><div id="dialog-content"></div><footer id="dialog-footer"></footer></form></dialog>
<script src="renderer.js"></script></body></html>
